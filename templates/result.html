<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Prediction Result</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Prediction</h1>
  <div class="result">
    <p><strong>Predicted survival:</strong> {{ pred_label }}</p>
    <p><strong>Probability:</strong> {{ "%.2f"|format(proba) }}</p>
  </div>
  {% if shap_img %}
  <h2>SHAP feature contributions</h2>
  <img src="{{ shap_img }}" alt="shap force plot">
  {% endif %}
  <p><a href="/">try another</a></p>
</body>
</html>
