data:
  train_csv: data/train.csv
  test_size: 0.2
  random_state: 42

model:
  type: random_forest
  n_estimators: 300
  max_depth: 8
  min_samples_split: 4
  min_samples_leaf: 2

features:
  numerical:
    - Age
    - Fare
    - SibSp
    - Parch
  categorical:
    - Sex
    - Embarked
    - Pclass

artifacts:
  model_path: artifacts/model.pkl
  preproc_path: artifacts/preproc.pkl

serve:
  host: 0.0.0.0
  port: 5000
