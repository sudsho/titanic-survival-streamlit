data:
  train_csv: data/train.csv
  test_size: 0.2
  random_state: 42

model:
  type: gbm
  n_estimators: 200
  max_depth: 3
  learning_rate: 0.05

features:
  numerical:
    - Age
    - Fare
    - SibSp
    - Parch
    - FamilySize
  categorical:
    - Sex
    - Embarked
    - Pclass
    - Title

artifacts:
  model_path: artifacts/model_gbm.pkl
  preproc_path: artifacts/preproc.pkl
